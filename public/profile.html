<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>マイページ Profile — Mālama Map</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 共通ヘッダー / ナビ -->
  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="logo" src="favicon.svg" alt="Mālama Map ロゴ" width="30" height="30" />
      <span>
        <span class="title">Mālama Map</span>
        <span class="tagline" data-i18n="header.tagline">ハワイ在来植物を守る市民マップ</span>
      </span>
    </a>
    <nav class="main-nav">
      <a href="map.html">地図<small>Map</small></a>
      <a href="plants.html">植物図鑑<small>Plants</small></a>
      <a href="report.html">投稿<small>Report</small></a>
      <a href="stats.html">統計<small>Stats</small></a>
    </nav>
  </header>

  <main class="plants-page">
    <div class="page-intro">
      <h1>マイページ Profile</h1>
    </div>

    <!-- プロフィール概要 -->
    <section class="profile-head">
      <div class="profile-avatar" id="pAvatar" aria-hidden="true"></div>
      <div class="profile-info">
        <div class="profile-name" id="pName">—</div>
        <div class="profile-meta" id="pJoinedRow">
          <span data-i18n="profile.joined">参加日</span> <span id="pJoined">—</span>
        </div>
        <div class="profile-stats" id="pStats">—</div>
      </div>
      <button type="button" id="logoutBtn" class="ghost-btn" data-i18n="profile.logout" hidden>ログアウト</button>
    </section>

    <h2 class="profile-section-title" id="findsTitle">見つけた植物 My Finds</h2>
    <div class="plant-grid" id="myFinds"></div>
  </main>

  <footer class="site-footer">
    Mālama Map — <span data-i18n="footer.profile">フェーズ2 · あなたの発見の記録</span>
  </footer>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="data.js"></script>
  <script>
    // ?user=<投稿者名> があれば「他人の公開プロフィール」、無ければ「自分のプロフィール」
    const viewUser = new URLSearchParams(location.search).get("user");
    if (viewUser) {
      renderProfile(viewUser, false, null);               // 公開ビュー（ログイン不要）
    } else {
      requireLogin().then(function (user) {               // 自分（ログイン必須）
        if (user) renderProfile(userDisplayName(user), true, user);
      });
    }

    async function renderProfile(name, isOwn, user) {
      // ---- プロフィール概要 ----
      document.getElementById("pName").textContent = name;
      document.getElementById("pAvatar").textContent = (name[0] || "?").toUpperCase();

      // 見出し（自分＝My Finds / 他人＝〇〇の発見）
      document.getElementById("findsTitle").textContent =
        isOwn ? t("profile.finds_mine") : t("profile.finds_other", { name: name });

      // 参加日は自分のみ（他人のアカウント作成日は取得できないので隠す）
      if (isOwn && user && user.created_at) {
        document.getElementById("pJoined").textContent = new Date(user.created_at)
          .toLocaleDateString(window.LANG === "ja" ? "ja-JP" : "en-US", { year: "numeric", month: "long", day: "numeric" });
      } else {
        document.getElementById("pJoinedRow").hidden = true;
      }

      // ログアウトは自分のみ表示
      if (isOwn) {
        const lo = document.getElementById("logoutBtn");
        lo.hidden = false;
        lo.addEventListener("click", function () { signOut(); });
      }

      // ---- 投稿を集計（自分は user_id 優先、他人は投稿者名で一致） ----
      await loadSightings();
      const mine = getAllSightings().filter(function (s) {
        if (isOwn && user) return (s.user_id && s.user_id === user.id) || s.reporter === name;
        return s.reporter === name;
      });

      // 種ごとにまとめる（骨格種は id、コミュニティ種は学名でキー化）
      const bySpecies = {};
      mine.forEach(function (s) {
        const plant = getPlantById(s.plantId);
        const key = plant ? plant.id : (s.speciesName || "unknown");
        if (!bySpecies[key]) {
          bySpecies[key] = {
            plant: plant || null,
            speciesName: s.speciesName || (plant ? plant.scientificName : t("profile.unconfirmed")),
            count: 0, photo: null, first: s.date, last: s.date,
          };
        }
        const g = bySpecies[key];
        g.count++;
        if (s.photoUrl && !g.photo) g.photo = s.photoUrl;
        if (s.date < g.first) g.first = s.date;
        if (s.date > g.last) g.last = s.date;
      });
      const species = Object.keys(bySpecies).map(function (k) { return bySpecies[k]; });

      // ---- 統計 ----
      document.getElementById("pStats").textContent =
        t("profile.stats", { species: species.length, reports: mine.length });

      // ---- 発見した植物カード ----
      const grid = document.getElementById("myFinds");
      if (!species.length) {
        grid.innerHTML = '<p class="dex-empty">' +
          (isOwn ? t("profile.empty") : t("profile.empty_other")) + "</p>";
        return;
      }
      // 発見数が多い順
      species.sort(function (a, b) { return b.count - a.count; });

      species.forEach(function (g) {
        const plant = g.plant;
        const hawName = plant ? plant.hawaiianName : g.speciesName;
        const sciName = plant ? plant.scientificName : g.speciesName;
        const category = plant ? plant.category : "community";
        const catLabel = category === "native" ? t("stats.legend_native")
                       : category === "invasive" ? t("stats.legend_invasive")
                       : t("plants.community_tag");
        const photoSrc = g.photo || (plant ? plant.imageUrl : null);
        const color = plant ? plant.color : "#6b7261";

        const card = document.createElement("article");
        card.className = "plant-card";

        const photoHtml = photoSrc
          ? '<img src="' + photoSrc + '" alt="' + hawName + '" loading="lazy" onerror="this.style.display=\'none\'">'
          : '<div class="photo-fallback" style="background:' + color + '"></div>';

        const dateText = g.first === g.last
          ? g.last
          : g.first + " 〜 " + g.last;

        card.innerHTML =
          '<div class="plant-photo">' + photoHtml +
            '<span class="cat-tag ' + category + '">' + catLabel + "</span>" +
            '<span class="dex-state found">×' + g.count + "</span>" +
          "</div>" +
          '<div class="plant-body">' +
            '<div class="haw-name">' + hawName + "</div>" +
            '<div class="sci-name">' + sciName + "</div>" +
            '<div class="find-date">' + dateText + "</div>" +
          "</div>";

        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
