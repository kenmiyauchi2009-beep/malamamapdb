
























<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title.profile">Profile — Mālama Map</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 共通ヘッダー / ナビ -->
  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="logo" src="favicon.svg" alt="Mālama Map ロゴ" width="30" height="30" />
      <span>
        <span class="title">Mālama Map</span>
        <span class="tagline" data-i18n="header.tagline">ハワイ在来植物を守る市民マップ</span>
      </span>
    </a>
    <nav class="main-nav">
      <a href="map.html" data-i18n="nav.map">Map</a>
      <a href="plants.html" data-i18n="nav.plants">Plants</a>
      <a href="report.html" data-i18n="nav.report">Report</a>
      <a href="stats.html" data-i18n="nav.stats">Stats</a>
    </nav>
  </header>

  <main class="plants-page">
    <div class="page-intro">
      <h1 data-i18n="profile.heading">Profile</h1>
    </div>

    <!-- プロフィール概要 -->
    <section class="profile-head">
      <div class="profile-avatar" id="pAvatar" aria-hidden="true"></div>
      <div class="profile-info">
        <div class="profile-name" id="pName">—</div>
        <div class="profile-meta" id="pJoinedRow">
          <span data-i18n="profile.joined">参加日</span> <span id="pJoined">—</span>
        </div>
        <div class="profile-stats" id="pStats">—</div>
      </div>
      <button type="button" id="logoutBtn" class="ghost-btn" data-i18n="profile.logout" hidden>ログアウト</button>
    </section>

    <h2 class="profile-section-title" id="findsTitle">My Finds</h2>
    <div class="plant-grid" id="myFinds"></div>
  </main>

  <footer class="site-footer">
    Mālama Map — <span data-i18n="footer.profile">フェーズ2 · あなたの発見の記録</span>
  </footer>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="data.js"></script>
  <script>
    // ?user=<投稿者名> があれば「他人の公開プロフィール」、無ければ「自分のプロフィール」
    const viewUser = new URLSearchParams(location.search).get("user");
    if (viewUser) {
      renderProfile(viewUser, false, null);               // 公開ビュー（ログイン不要）
    } else {
      requireLogin().then(function (user) {               // 自分（ログイン必須）
        if (user) renderProfile(userDisplayName(user), true, user);
      });
    }

    async function renderProfile(name, isOwn, user) {
      // ---- プロフィール概要 ----
      document.getElementById("pName").textContent = name;
      document.getElementById("pAvatar").textContent = (name[0] || "?").toUpperCase();

      // 見出し（自分＝My Finds / 他人＝〇〇の発見）
      document.getElementById("findsTitle").textContent =
        isOwn ? t("profile.finds_mine") : t("profile.finds_other", { name: name });

      // 参加日は自分のみ（他人のアカウント作成日は取得できないので隠す）
      if (isOwn && user && user.created_at) {
        document.getElementById("pJoined").textContent = new Date(user.created_at)
          .toLocaleDateString(window.LANG === "ja" ? "ja-JP" : "en-US", { year: "numeric", month: "long", day: "numeric" });
      } else {
        document.getElementById("pJoinedRow").hidden = true;
      }

      // ログアウトは自分のみ表示
      if (isOwn) {
        const lo = document.getElementById("logoutBtn");
        lo.hidden = false;
        lo.addEventListener("click", function () { signOut(); });
      }

      // ---- 投稿を取得して描画 ----
      await loadSightings();
      renderFinds(name, isOwn, user);
    }

    // その人の投稿かどうか（自分は userId 優先、無ければ投稿者名で一致）
    function ownsSighting(s, name, isOwn, user) {
      if (isOwn && user) {
        return (s.userId && s.userId === user.id) ||
               (s.user_id && s.user_id === user.id) ||
               s.reporter === name;
      }
      return s.reporter === name;
    }

    // 統計＋発見カードを描画（削除後にも呼び直して更新する）
    function renderFinds(name, isOwn, user) {
      const mine = getAllSightings().filter(function (s) {
        return ownsSighting(s, name, isOwn, user);
      });

      // 統計（発見した種数＝集約したキー数、投稿数＝件数）
      const speciesKeys = {};
      mine.forEach(function (s) {
        const p = getPlantById(s.plantId);
        speciesKeys[p ? p.id : (s.speciesName || "unknown")] = true;
      });
      document.getElementById("pStats").textContent =
        t("profile.stats", { species: Object.keys(speciesKeys).length, reports: mine.length });

      const grid = document.getElementById("myFinds");
      grid.innerHTML = "";
      if (!mine.length) {
        grid.innerHTML = '<p class="dex-empty">' +
          (isOwn ? t("profile.empty") : t("profile.empty_other")) + "</p>";
        return;
      }

      if (isOwn) {
        // 自分：1投稿ずつ（新しい順）＝各カードに削除ボタン（種の全投稿をまとめて消さない）
        mine.slice()
          .sort(function (a, b) { return a.date < b.date ? 1 : -1; })
          .forEach(function (s) { grid.appendChild(buildPostCard(s, name, isOwn, user)); });
      } else {
        // 他人：種ごとに集約したカード（削除ボタンなし）
        const bySpecies = {};
        mine.forEach(function (s) {
          const plant = getPlantById(s.plantId);
          const key = plant ? plant.id : (s.speciesName || "unknown");
          if (!bySpecies[key]) {
            bySpecies[key] = {
              plant: plant || null,
              speciesName: s.speciesName || (plant ? plant.scientificName : t("profile.unconfirmed")),
              count: 0, photo: null, first: s.date, last: s.date,
            };
          }
          const g = bySpecies[key];
          g.count++;
          if (s.photoUrl && !g.photo) g.photo = s.photoUrl;
          if (s.date < g.first) g.first = s.date;
          if (s.date > g.last) g.last = s.date;
        });
        Object.keys(bySpecies).map(function (k) { return bySpecies[k]; })
          .sort(function (a, b) { return b.count - a.count; })
          .forEach(function (g) { grid.appendChild(buildSpeciesCard(g)); });
      }
    }

    // 種を表す共通のカード骨格を作る（写真・カテゴリタグ・名前・日付）
    function cardShell(plant, speciesName, category, photoSrc, dateText) {
      const hawName = plant ? plant.hawaiianName : speciesName;
      const sciName = plant ? plant.scientificName : speciesName;
      const catLabel = category === "native" ? t("stats.legend_native")
                     : category === "invasive" ? t("stats.legend_invasive")
                     : t("plants.community_tag");
      const color = plant ? plant.color : "#6b7261";
      const photoHtml = photoSrc
        ? '<img src="' + photoSrc + '" alt="' + hawName + '" loading="lazy" onerror="this.style.display=\'none\'">'
        : '<div class="photo-fallback" style="background:' + color + '"></div>';

      const card = document.createElement("article");
      card.className = "plant-card";
      card.innerHTML =
        '<div class="plant-photo">' + photoHtml +
          '<span class="cat-tag ' + category + '">' + catLabel + "</span>" +
        "</div>" +
        '<div class="plant-body">' +
          '<div class="haw-name">' + hawName + "</div>" +
          '<div class="sci-name">' + sciName + "</div>" +
          '<div class="find-date">' + dateText + "</div>" +
        "</div>";
      return card;
    }

    // 集約カード（他人のプロフィール用・件数バッジ付き）
    function buildSpeciesCard(g) {
      const plant = g.plant;
      const category = plant ? plant.category : "community";
      const photoSrc = g.photo || (plant ? plant.imageUrl : null);
      const dateText = g.first === g.last ? g.last : g.first + " 〜 " + g.last;
      const card = cardShell(plant, g.speciesName, category, photoSrc, dateText);
      const badge = document.createElement("span");
      badge.className = "dex-state found";
      badge.textContent = "×" + g.count;
      card.querySelector(".plant-photo").appendChild(badge);
      return card;
    }

    // 1投稿カード（自分のプロフィール用・削除ボタン付き）
    function buildPostCard(s, name, isOwn, user) {
      const plant = getPlantById(s.plantId);
      const category = plant ? plant.category : "community";
      const speciesName = s.speciesName || (plant ? plant.scientificName : t("profile.unconfirmed"));
      const photoSrc = s.photoUrl || (plant ? plant.imageUrl : null);
      const card = cardShell(plant, speciesName, category, photoSrc, s.date);

      const del = document.createElement("button");
      del.type = "button";
      del.className = "del-btn";
      del.textContent = "🗑 " + t("delete.btn");
      del.addEventListener("click", function () { handleDeletePost(s.id, name, isOwn, user); });
      card.querySelector(".plant-body").appendChild(del);
      return card;
    }

    // 削除（確認＝最低1回）→ 成功でキャッシュから消え、リストと統計を再描画
    async function handleDeletePost(id, name, isOwn, user) {
      if (!window.confirm(t("delete.confirm"))) return;
      try {
        await deleteSighting(id);
        renderFinds(name, isOwn, user);
      } catch (err) {
        window.alert(t("delete.failed") + "\n" + err.message);
      }
    }
  </script>
</body>
</html>
