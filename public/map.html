<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title.map">Map — Mālama Map</title>

  <!-- Leaflet（地図ライブラリ）CDN・APIキー不要 -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <!-- 図鑑ノート風の見出しフォント（セリフ体 Fraunces） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 共通ヘッダー / ナビ -->
  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="logo" src="favicon.svg" alt="Mālama Map ロゴ" width="30" height="30" />
      <span>
        <span class="title">Mālama Map</span>
        <span class="tagline" data-i18n="header.tagline">ハワイ在来植物を守る市民マップ</span>
      </span>
    </a>
    <nav class="main-nav">
      <a href="map.html" class="active" data-i18n="nav.map">Map</a>
      <a href="plants.html" data-i18n="nav.plants">Plants</a>
      <a href="report.html" data-i18n="nav.report">Report</a>
      <a href="stats.html" data-i18n="nav.stats">Stats</a>
      <a href="#" class="disabled" data-i18n="nav.mypage">My Page</a>
    </nav>
  </header>

  <!-- メイン：左に地図 / 右に最新投稿 -->
  <main class="layout">
    <section>
      <div id="map"></div>
    </section>

    <aside class="sidebar">
      <div class="legend">
        <h3 data-i18n="map.legend_title">Legend</h3>
        <div class="legend-item"><span class="dot native"></span> <span data-i18n="legend.native">Native</span></div>
        <div class="legend-item"><span class="dot invasive"></span> <span data-i18n="legend.invasive">Invasive</span></div>
        <div class="legend-item"><span class="dot rod"></span> <span data-i18n="index.legend_rod">ROD 要観察（ʻŌhiʻa）</span></div>
      </div>

      <h2 data-i18n="map.recent">Recent Sightings</h2>
      <div class="feed" id="feed"><!-- map.js が投稿カードを差し込む --></div>
    </aside>
  </main>

  <footer class="site-footer">
    Mālama Map — <span data-i18n="footer.community">市民科学でハワイの森を守る · みんなの投稿を共有</span>
  </footer>

  <!-- 設定 → i18n → supabase-js → 認証 → Leaflet → データ → 地図ロジック の順で読み込む -->
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="data.js"></script>
  <script src="map.js"></script>
</body>
</html>
