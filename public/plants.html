<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>植物図鑑 Plants — Mālama Map</title>

  <!-- Leaflet（詳細モーダルのミニ地図用） -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <!-- 図鑑ノート風の見出しフォント（セリフ体 Fraunces） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 共通ヘッダー / ナビ -->
  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="logo" src="favicon.svg" alt="Mālama Map ロゴ" width="30" height="30" />
      <span>
        <span class="title">Mālama Map</span>
        <span class="tagline">ハワイ在来植物を守る市民マップ</span>
      </span>
    </a>
    <nav class="main-nav">
      <a href="index.html">地図<small>Map</small></a>
      <a href="plants.html" class="active">植物図鑑<small>Plants</small></a>
      <a href="report.html">投稿<small>Report</small></a>
      <a href="stats.html">統計<small>Stats</small></a>
      <a href="#" class="disabled">マイページ<small>Profile</small></a>
    </nav>
  </header>

  <main class="plants-page">
    <div class="page-intro">
      <h1>植物図鑑 Plants</h1>
      <p>ハワイの在来種と、森を脅かす外来種。見つけて投稿すると図鑑が埋まっていきます。</p>
      <div class="dex-progress" id="dexProgress"></div>
    </div>

    <!-- フィルタ（plants.js が動かす） -->
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">すべて All</button>
      <button class="filter-btn" data-filter="native">在来種 Native</button>
      <button class="filter-btn" data-filter="invasive">外来種 Invasive</button>
    </div>

    <!-- カードがここに入る -->
    <div class="plant-grid" id="plantGrid"></div>
  </main>

  <footer class="site-footer">
    Mālama Map — 市民科学でハワイの森を守る · みんなの投稿を共有
  </footer>

  <!-- 設定 → supabase-js → 認証 → Leaflet → データ → 図鑑ロジック -->
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="data.js"></script>
  <script src="plants.js"></script>
</body>
</html>
